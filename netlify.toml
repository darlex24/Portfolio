# Netlify settings: plain static site, no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep the separate retail portfolio off this site.
[[redirects]]
  from = "/retail-site/*"
  to = "/404"
  status = 404
  force = true
